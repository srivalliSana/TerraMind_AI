# Risk / alert thresholds.
# These are ENGINEERING DEFAULTS chosen to be conservative and tunable.
# They are NOT scientifically validated universal rules and must be calibrated
# per crop and region against field observations.
validated: false

anomaly:
  zscore_watch: -1.5         # deviation from the seasonal baseline, in standard deviations
  zscore_elevated: -2.0
  zscore_high: -3.0
  min_persistence_obs: 2     # consecutive anomalous observations to count as sustained

affected_area:
  pixel_zscore: -2.0         # a pixel counts as affected at or below this z (about 2.3% expected by chance in a normal year)
  min_fraction_watch: 0.05
  min_fraction_elevated: 0.15
  min_fraction_high: 0.30

quality:
  min_valid_fraction: 0.30
  low_confidence_below: 0.60

scoring:                     # transparent, tunable weights (engineering defaults, not validated)
  max_magnitude: 50          # points available for deviation from baseline
  max_persistence: 30        # points for consecutive anomalous observations
  max_extent: 20             # points for affected-area fraction (rescaled away when extent is unknown)
  weight_ndvi: 1.0
  weight_ndmi: 0.7           # moisture alone is weaker evidence of stress than greenness
  persistence_full_obs: 4    # consecutive anomalous observations that earn full persistence points
  stale_after_days: 30       # latest observation older than this lowers confidence
  min_baseline_years: 3      # fewer distinct years than this caps confidence (a 1-2 year record is not a climatology)
  confidence_cap_thin_baseline: 0.60
  confidence_medium: 0.45
  confidence_high: 0.70

risk_categories:             # upper bounds of the 0-100 score
  informational: 25
  watch: 50
  elevated: 75
  high: 100
