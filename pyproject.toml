[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terramind-ai"
version = "0.1.0"
description = "Satellite-based crop stress detection and early warning platform (preliminary indicators, not diagnoses)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2,<3",          # stackstac currently requires pandas<3
    "scipy>=1.13",
    "rasterio>=1.4",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "xarray>=2024.6",
    "dask>=2024.6",
    "scikit-learn>=1.5",
    "earthaccess>=0.14",
    "pystac-client>=0.8",
    "stackstac>=0.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "requests>=2.32",
    "tenacity>=8.5",
    "pyarrow>=16",
    "plotly>=5.22",
    "folium>=0.17",
    "streamlit>=1.40",
    "streamlit-folium>=0.22",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5"]
# PyTorch is deliberately optional: advanced models (Stage C) are only added
# when labelled data justify them. Install separately, see docs/DEPLOYMENT.md.

[project.scripts]
terramind = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: needs network and NASA Earthdata credentials (deselected by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]
